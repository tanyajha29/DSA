name: Auto Update DSA READMEs

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

concurrency:
  group: readme-update-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run README updater
        run: python update_readme.py

      - name: Commit and push README updates
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "chore: auto-update DSA topic READMEs [skip ci]"

          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              echo "::error::Could not rebase README updates onto the latest origin/main. Resolve the conflicting README/update changes and rerun this workflow."
              git rebase --abort || true
              exit 1
            fi

            if git diff --quiet origin/main..HEAD; then
              echo "README updates already exist on origin/main after rebase."
              exit 0
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "::warning::Push attempt ${attempt} failed, likely because origin/main moved. Rebasing and retrying."
            sleep 5
          done

          echo "::error::Failed to push README updates after rebasing and retrying."
          exit 1

